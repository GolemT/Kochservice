stages:
  - quality
  - build
  - test
  - docker
  - deploy_dev
  - deploy

variables:
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  IMAGE_LATEST: $CI_REGISTRY_IMAGE:latest

cache:
  key: $CI_COMMIT_REF_SLUG
  paths:
    - node_modules/
    - .pnpm-store/

code_quality:
  stage: quality
  script:
    - pnpm install
    - pnpm prettier --check .
  allow_failure: true

build:
  stage: build
  script:
    - pnpm install
    - pnpm build
  artifacts:
    paths:
      - .next/
      - public/
      - package.json
      - pnpm-lock.yaml
      - next.config.ts
    expire_in: 1 hour

unit_test:
  stage: test
  script:
    - pnpm install
    - pnpm test:unit  # vitest
  dependencies:
    - build
  allow_failure: true

