workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      variables:
        DEPLOY_ENV: prod
        CONTAINER_NAME: frontend
        HOST_PORT: "3000"
        DEPLOY_URL: https://kochservice.golemt.org
    - if: '$CI_COMMIT_BRANCH == "dev"'
      variables:
        DEPLOY_ENV: dev
        CONTAINER_NAME: frontend_dev
        HOST_PORT: "3100"
        DEPLOY_URL: https://dev-kochservice.golemt.org

stages:
  - triggers

frontend:pipeline:
  stage: triggers
  trigger:
    include: client/.gitlab-ci.yml
    strategy: depend
  variables:
    DEPLOY_ENV: $DEPLOY_ENV
    CONTAINER_NAME: $CONTAINER_NAME
    HOST_PORT: $HOST_PORT
    DEPLOY_URL: $DEPLOY_URL
    VITE_API_BASE: $VITE_API_BASE
  rules:
    - changes:
        - client/**/*
        - .gitlab-ci.yml

backend:pipeline:
  stage: triggers
  trigger:
    include: server/.gitlab-ci.yml
    strategy: depend
  rules:
    - changes:
        - server/**/*
        - .gitlab-ci.yml
