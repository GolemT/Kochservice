docker_build:
  stage: docker
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $IMAGE_TAG -t $IMAGE_LATEST .
    - docker push $IMAGE_TAG
    - docker push $IMAGE_LATEST
  dependencies:
    - build
  only:
    - main
    - dev

deploy_dev:
  stage: deploy_dev
  tags:
    - deployment
  variables:
    IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull $IMAGE
    - docker stop frontend_dev || true
    - docker rm frontend_dev || true
    - docker run -d --name frontend_dev -p 3100:3000 -e NEXT_PUBLIC_API_BASE=$NEXT_PUBLIC_API_BASE_DEV -e NEXT_PUBLIC_DOMAIN=$NEXT_PUBLIC_DOMAIN_DEV --network kochservice-network --restart unless-stopped $IMAGE
  only:
    - dev
  environment:
    name: dev
    url: https://dev-kochservice.golemt.org

deploy:
  stage: deploy
  tags:
    - deployment
  variables:
    IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull $IMAGE
    - docker stop frontend || true
    - docker rm frontend || true
    - docker run -d --name frontend -p 3000:3000 -e NEXT_PUBLIC_API_BASE=$NEXT_PUBLIC_API_BASE_PROD -e NEXT_PUBLIC_DOMAIN=$NEXT_PUBLIC_DOMAIN_PROD --network kochservice-network --restart unless-stopped $IMAGE
  only:
    - main
  environment:
    name: prod
    url: https://kochservice.golemt.org