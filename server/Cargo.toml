[package]
name = "kochservice"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "migration"]

[dependencies]
migration = { path = "./migration" }
sea-orm = { version = "2.0.0-rc.27", features = ["sqlx-postgres", "runtime-tokio", "macros", "mock"] }
sea-orm-migration = { version = "2.0.0-rc.27", features = ["runtime-tokio", "sqlx-postgres"] }
serde = "1.0.228"
axum = "0.8.8"
tokio = { version = "1.49.0", features = ["rt", "rt-multi-thread", "macros"] }
log = "0.4.29"
utoipa = { version = "5.4.0", features = ["axum_extras", "uuid"] }
utoipa-scalar = { version = "0.3.0", features = ["axum"] }
dotenvy = "0.15.7"
uuid = { version = "1.19.0", features = ["default", "v7", "serde"] }
serde_json = "1.0.149"
thiserror = "2.0.17"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
sentry = "0.47.0"
sentry-tracing = "0.47.0"
reqwest = { version = "0.13.2", default-features = false, features = ["rustls", "json"] }
