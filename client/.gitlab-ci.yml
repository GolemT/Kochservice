variables:
  FRONTEND_IMAGE_TAG: $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA
  FRONTEND_IMAGE_LATEST: $CI_REGISTRY_IMAGE/frontend:latest


frontend:code_quality:
  stage: quality
  before_script:
    - cd client
  script:
    - pnpm install
    - pnpm prettier --check .
  allow_failure: true

frontend:build:
  stage: build
  before_script:
    - cd client
  script:
    - pnpm install
    - pnpm build
  artifacts:
    paths:
      - client/dist/
    expire_in: 1 hour

frontend:unit_test:
  stage: test
  before_script:
    - cd client
  script:
    - pnpm install
    - pnpm vitest run --coverage
  coverage: '/Lines\s*:\s*([\d.]+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: client/coverage/cobertura-coverage.xml
  dependencies:
    - frontend:build
  allow_failure: true

frontend:docker_build:
  stage: docker
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build --build-arg VITE_API_BASE=$VITE_API_BASE --build-arg VITE_SENTRY_DSN=$VITE_SENTRY_DSN --build-arg VITE_DEPLOY_ENV=$VITE_DEPLOY_ENV -t $FRONTEND_IMAGE_TAG -t $FRONTEND_IMAGE_LATEST -f client/Dockerfile client/
    - docker push $FRONTEND_IMAGE_TAG
    - docker push $FRONTEND_IMAGE_LATEST
  dependencies:
    - frontend:build
  environment:
    name: $DEPLOY_ENV/client

frontend:deploy:
  stage: deploy
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull $FRONTEND_IMAGE_TAG
    - docker stop $CONTAINER_NAME || true
    - docker rm $CONTAINER_NAME || true
    - docker run -d --name $CONTAINER_NAME -p $HOST_PORT:80 --network kochservice-network --restart unless-stopped $FRONTEND_IMAGE_TAG
  environment:
    name: $DEPLOY_ENV/client
    url: $DEPLOY_URL
