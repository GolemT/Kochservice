workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      variables:
        DEPLOY_ENV: prod
        CONTAINER_NAME: frontend
        HOST_PORT: "3000"
        DEPLOY_URL: https://kochservice.golemt.org
    - if: '$CI_COMMIT_BRANCH == "dev"'
      variables:
        DEPLOY_ENV: dev
        CONTAINER_NAME: frontend_dev
        HOST_PORT: "3100"
        DEPLOY_URL: https://dev-kochservice.golemt.org

stages:
  - quality
  - build
  - test
  - docker
  - deploy_dev
  - deploy

variables:
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  IMAGE_LATEST: $CI_REGISTRY_IMAGE:latest

cache:
  key: $CI_COMMIT_REF_SLUG
  paths:
    - node_modules/
    - .pnpm-store/

code_quality:
  stage: quality
  script:
    - pnpm install
    - pnpm prettier --check .
  allow_failure: true

build:
  stage: build
  script:
    - pnpm install
    - pnpm build
  artifacts:
    paths:
      - dist/
      - package.json
      - pnpm-lock.yaml
    expire_in: 1 hour

unit_test:
  stage: test
  script:
    - pnpm install
    - pnpm test:unit  # vitest
  dependencies:
    - build
  allow_failure: true

